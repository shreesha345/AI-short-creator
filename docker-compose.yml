services:
  backend:
    build:
      context: .
      dockerfile: backend.Dockerfile
    container_name: ai-short-creator-backend
    ports:
      - "8000:8000"
    environment:
      - PYTHONUNBUFFERED=1
      - TEST_MODE=${TEST_MODE:-false}
    env_file:
      - .env
    volumes:
      - ./data:/app/data
      - ./backend:/app/backend
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: frontend.Dockerfile
    container_name: ai-short-creator-frontend
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
    volumes:
      - ./frontend:/app
      - /app/node_modules
    restart: unless-stopped
    depends_on:
      - backend
